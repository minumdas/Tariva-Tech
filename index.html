    <!-- ══════════════════════════════════════════════════════════════════
         SECURITY HEADERS (meta-equivalent for static hosting)
         ══════════════════════════════════════════════════════════════════ -->

    <!-- Content-Security-Policy
         – default-src 'self'      : blocks all external resources by default
         – script-src 'self' 'unsafe-inline' : Vite injects inline init scripts; tighten
           this to a nonce-based policy once a backend is added
         – style-src 'self' 'unsafe-inline'  : Tailwind/Framer-Motion use inline styles
         – img-src 'self' data: https:        : allow images from same origin + Pexels CDN
         – font-src 'self' data:              : allow self-hosted fonts (@fontsource)
         – connect-src 'self'                 : blocks unauthorized XHR/fetch targets
         – object-src 'none'                  : disables Flash/plugins entirely
         – base-uri 'self'                    : prevents base-tag hijacking
         – frame-ancestors 'none'             : clickjacking protection (same as X-Frame-Options DENY)
    -->
    <meta http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: https:;
        font-src 'self' data:;
        connect-src 'self' https://api.emailjs.com;;
        object-src 'none';
        base-uri 'self';
        
      " />

    <!-- Clickjacking protection and Security headers -->
<!--
    <meta http-equiv="X-Frame-Options" content="DENY" />

-->

    <!-- Permissions Policy – disable sensors/APIs that this site doesn't need -->
    <meta http-equiv="Permissions-Policy"
      content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" />

    <!-- Force HTTPS on browsers that support it -->
    <meta http-equiv="Strict-Transport-Security" content="max-age=31536000; includeSubDomains" />

    <!-- ══════════════════════════════════════════════════════════════════
         END SECURITY HEADERS
